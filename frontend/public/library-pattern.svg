<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="books" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="none"/>
      <!-- Book 1 -->
      <rect x="10" y="20" width="15" height="60" rx="2" fill="#ffffff" opacity="0.2"/>
      <!-- Book 2 -->
      <rect x="30" y="25" width="10" height="55" rx="2" fill="#ffffff" opacity="0.2"/>
      <!-- Book 3 -->
      <rect x="45" y="30" width="20" height="50" rx="2" fill="#ffffff" opacity="0.2"/>
      <!-- Book 4 -->
      <rect x="70" y="35" width="12" height="45" rx="2" fill="#ffffff" opacity="0.2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#books)"/>
</svg>

